name: Seed RDS

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Optional commit SHA (empty = latest main)
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: admin-be-production
  cancel-in-progress: false

jobs:
  seed:
    name: Apply RDS light seed
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      INSTANCE_ID: ${{ vars.ADMIN_EC2_INSTANCE_ID }}
      DEPLOY_PATH: ${{ vars.ADMIN_DEPLOY_PATH || '/home/ec2-user/app/chookjibupAdmin_BE' }}
      DEPLOY_USER: ${{ vars.ADMIN_DEPLOY_USER || 'ec2-user' }}
      DEPLOY_HOME: ${{ vars.ADMIN_DEPLOY_HOME || '/home/ec2-user' }}
      JAVA_HOME: ${{ vars.ADMIN_JAVA_HOME || '/usr/lib/jvm/java-21-amazon-corretto.x86_64' }}
      SECRET_PARAMETER: ${{ vars.ADMIN_APPLICATION_SECRET_PARAMETER || '/chookjibup/admin/application-secret-yml' }}
      SECRET_FILE: ${{ vars.ADMIN_APPLICATION_SECRET_FILE || '/etc/chookjibup-admin/application-secret.yml' }}
      SEED_SQL_RELPATH: docs/seed-data/시드데이터_RDS경량_통합.sql
      SEED_SCRIPT_RELPATH: .github/scripts/apply-rds-seed.sh

    steps:
      - name: Validate seed configuration
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          MISSING=()
          [[ -n "$AWS_ACCESS_KEY_ID" ]] || MISSING+=("AWS_ACCESS_KEY_ID secret")
          [[ -n "$AWS_SECRET_ACCESS_KEY" ]] || MISSING+=("AWS_SECRET_ACCESS_KEY secret")
          [[ -n "$INSTANCE_ID" ]] || MISSING+=("ADMIN_EC2_INSTANCE_ID variable")

          if (( ${#MISSING[@]} > 0 )); then
            printf 'Missing production configuration: %s\n' "${MISSING[@]}"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve target SHA
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail

          LATEST_MAIN_SHA=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/main" \
            --jq '.sha')

          if [[ -n "${INPUT_SHA// }" ]]; then
            TARGET_SHA="$INPUT_SHA"
          else
            TARGET_SHA="$LATEST_MAIN_SHA"
          fi

          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Seeding with commit: $TARGET_SHA"
          echo "Latest main: $LATEST_MAIN_SHA"

      - name: Apply seed via SSM
        shell: bash
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
        run: |
          set -euo pipefail

          COMMANDS=$(jq -cn \
            --arg deployPath "$DEPLOY_PATH" \
            --arg deployUser "$DEPLOY_USER" \
            --arg deployHome "$DEPLOY_HOME" \
            --arg javaHome "$JAVA_HOME" \
            --arg targetSha "$TARGET_SHA" \
            --arg awsRegion "$AWS_REGION" \
            --arg secretParameter "$SECRET_PARAMETER" \
            --arg secretFile "$SECRET_FILE" \
            --arg seedSqlRelpath "$SEED_SQL_RELPATH" \
            --arg seedScriptRelpath "$SEED_SCRIPT_RELPATH" \
            '[
              "set -euo pipefail",
              ("cd " + ($deployPath | @sh)),
              ("sudo -u " + ($deployUser | @sh) + " git fetch --prune origin"),
              ("sudo -u " + ($deployUser | @sh) + " git reset --hard " + ($targetSha | @sh)),
              ("SEED_SCRIPT=" + (($deployPath + "/" + $seedScriptRelpath) | @sh)),
              ("SEED_SQL=" + (($deployPath + "/" + $seedSqlRelpath) | @sh)),
              ("SECRET_FILE=" + ($secretFile | @sh)),
              ("DEPLOY_PATH=" + ($deployPath | @sh)),
              ("JAVA_HOME=" + ($javaHome | @sh)),
              ("HOME=" + ($deployHome | @sh)),
              "test -f \"$SEED_SCRIPT\"",
              "test -f \"$SEED_SQL\"",
              ("chmod +x " + (($deployPath + "/" + $seedScriptRelpath) | @sh)),
              "SECRET_DIR=$(dirname \"$SECRET_FILE\")",
              "install -d -m 750 \"$SECRET_DIR\"",
              ("chown " + ($deployUser | @sh) + " \"$SECRET_DIR\""),
              "SECRET_TMP=$(mktemp \"${SECRET_FILE}.XXXXXX\")",
              ("aws ssm get-parameter --region " + ($awsRegion | @sh) + " --name " + ($secretParameter | @sh) + " --with-decryption --query Parameter.Value --output text > \"$SECRET_TMP\""),
              ("chown " + ($deployUser | @sh) + " \"$SECRET_TMP\""),
              "chmod 600 \"$SECRET_TMP\"",
              "mv -f \"$SECRET_TMP\" \"$SECRET_FILE\"",
              ("sudo -u " + ($deployUser | @sh) + " env SECRET_FILE=\"$SECRET_FILE\" SEED_SQL=\"$SEED_SQL\" DEPLOY_PATH=\"$DEPLOY_PATH\" JAVA_HOME=\"$JAVA_HOME\" HOME=\"$HOME\" \"$SEED_SCRIPT\"")
            ]')
          PARAMETERS=$(jq -cn --argjson commands "$COMMANDS" '{commands: $commands}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Seed Admin BE RDS $TARGET_SHA" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS="Pending"
          for attempt in $(seq 1 90); do
            if ! STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null); then
              echo "Waiting for SSM invocation registration..."
              sleep 10
              continue
            fi

            echo "Status: $STATUS"
            if [[ "$STATUS" != "InProgress" \
              && "$STATUS" != "Pending" \
              && "$STATUS" != "Delayed" ]]; then
              break
            fi

            sleep 10
          done

          echo "----- Command output -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' \
            --output text

          if [[ "$STATUS" != "Success" ]]; then
            echo "Seed failed with status: $STATUS"
            exit 1
          fi
