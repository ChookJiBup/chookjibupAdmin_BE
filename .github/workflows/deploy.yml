name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-be-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      INSTANCE_ID: ${{ vars.ADMIN_EC2_INSTANCE_ID }}
      DEPLOY_PATH: ${{ vars.ADMIN_DEPLOY_PATH || '/home/ec2-user/app/chookjibupAdmin_BE' }}
      DEPLOY_USER: ${{ vars.ADMIN_DEPLOY_USER || 'ec2-user' }}
      DEPLOY_HOME: ${{ vars.ADMIN_DEPLOY_HOME || '/home/ec2-user' }}
      SYSTEMD_SERVICE: ${{ vars.ADMIN_SYSTEMD_SERVICE || 'chookjibup-admin-backend' }}
      JAVA_HOME: ${{ vars.ADMIN_JAVA_HOME || '/usr/lib/jvm/java-21-amazon-corretto.x86_64' }}
      SECRET_PARAMETER: ${{ vars.ADMIN_APPLICATION_SECRET_PARAMETER || '/chookjibup/admin/application-secret-yml' }}
      SECRET_FILE: ${{ vars.ADMIN_APPLICATION_SECRET_FILE || '/etc/chookjibup-admin/application-secret.yml' }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          APPLICATION_SECRET_YML: ${{ secrets.ADMIN_APPLICATION_SECRET_YML }}
        run: |
          set -euo pipefail

          MISSING=()
          [[ -n "$AWS_ACCESS_KEY_ID" ]] || MISSING+=("AWS_ACCESS_KEY_ID secret")
          [[ -n "$AWS_SECRET_ACCESS_KEY" ]] || MISSING+=("AWS_SECRET_ACCESS_KEY secret")
          [[ -n "$APPLICATION_SECRET_YML" ]] || MISSING+=("ADMIN_APPLICATION_SECRET_YML secret")
          [[ -n "$INSTANCE_ID" ]] || MISSING+=("ADMIN_EC2_INSTANCE_ID variable")

          if (( ${#MISSING[@]} > 0 )); then
            printf 'Missing production configuration: %s\n' "${MISSING[@]}"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Store application secret in Parameter Store
        shell: bash
        env:
          APPLICATION_SECRET_YML: ${{ secrets.ADMIN_APPLICATION_SECRET_YML }}
        run: |
          set -euo pipefail

          aws ssm put-parameter \
            --name "$SECRET_PARAMETER" \
            --type SecureString \
            --value "$APPLICATION_SECRET_YML" \
            --overwrite >/dev/null

      - name: Deploy via SSM
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          LATEST_MAIN_SHA=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/main" \
            --jq '.sha')
          if [[ "$DEPLOY_SHA" != "$LATEST_MAIN_SHA" ]]; then
            echo "Skip stale deployment: $DEPLOY_SHA"
            echo "Latest main revision: $LATEST_MAIN_SHA"
            exit 0
          fi

          COMMANDS=$(jq -cn \
            --arg deployPath "$DEPLOY_PATH" \
            --arg deployUser "$DEPLOY_USER" \
            --arg deployHome "$DEPLOY_HOME" \
            --arg deploySha "$DEPLOY_SHA" \
            --arg javaHome "$JAVA_HOME" \
            --arg awsRegion "$AWS_REGION" \
            --arg service "$SYSTEMD_SERVICE" \
            --arg secretParameter "$SECRET_PARAMETER" \
            --arg secretFile "$SECRET_FILE" \
            '[
              "set -euo pipefail",
              ("cd " + ($deployPath | @sh)),
              ("sudo -u " + ($deployUser | @sh) + " git fetch --prune origin"),
              ("sudo -u " + ($deployUser | @sh) + " git reset --hard " + ($deploySha | @sh)),
              ("sudo -u " + ($deployUser | @sh) + " chmod +x ./gradlew"),
              ("rm -f " + (($deployPath + "/src/main/resources/application-secret.yml") | @sh)),
              ("sudo -u " + ($deployUser | @sh) + " env JAVA_HOME=" + ($javaHome | @sh) + " HOME=" + ($deployHome | @sh) + " ./gradlew build -x test --no-daemon"),
              ("SECRET_FILE=" + ($secretFile | @sh)),
              "SECRET_DIR=$(dirname \"$SECRET_FILE\")",
              "install -d -m 750 \"$SECRET_DIR\"",
              ("chown " + ($deployUser | @sh) + " \"$SECRET_DIR\""),
              "SECRET_TMP=$(mktemp \"${SECRET_FILE}.XXXXXX\")",
              ("aws ssm get-parameter --region " + ($awsRegion | @sh) + " --name " + ($secretParameter | @sh) + " --with-decryption --query Parameter.Value --output text > \"$SECRET_TMP\""),
              ("chown " + ($deployUser | @sh) + " \"$SECRET_TMP\""),
              "chmod 600 \"$SECRET_TMP\"",
              "mv -f \"$SECRET_TMP\" \"$SECRET_FILE\"",
              ("SERVICE_UNIT=" + ($service | @sh)),
              "case \"$SERVICE_UNIT\" in *.service) ;; *) SERVICE_UNIT=\"${SERVICE_UNIT}.service\" ;; esac",
              "DROPIN_DIR=\"/etc/systemd/system/${SERVICE_UNIT}.d\"",
              "install -d -m 755 \"$DROPIN_DIR\"",
              "printf \"[Service]\\nEnvironment=\\\"SPRING_CONFIG_IMPORT=file:%s\\\"\\n\" \"$SECRET_FILE\" > \"$DROPIN_DIR/application-secret.conf\"",
              "chmod 644 \"$DROPIN_DIR/application-secret.conf\"",
              "systemctl daemon-reload",
              ("systemctl restart " + ($service | @sh)),
              "sleep 10",
              ("systemctl is-active " + ($service | @sh))
            ]')
          PARAMETERS=$(jq -cn --argjson commands "$COMMANDS" '{commands: $commands}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Admin BE $DEPLOY_SHA" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS="Pending"
          for attempt in $(seq 1 90); do
            if ! STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null); then
              echo "Waiting for SSM invocation registration..."
              sleep 10
              continue
            fi

            echo "Status: $STATUS"
            if [[ "$STATUS" != "InProgress" \
              && "$STATUS" != "Pending" \
              && "$STATUS" != "Delayed" ]]; then
              break
            fi

            sleep 10
          done

          echo "----- Command output -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' \
            --output text

          if [[ "$STATUS" != "Success" ]]; then
            echo "Deployment failed with status: $STATUS"
            exit 1
          fi
