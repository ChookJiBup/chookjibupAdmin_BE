spring:
  application:
    name: chookjibupAdmin_BE
  config:
    import: optional:application-secret.yml
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chookjibup_admin}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:chookjibup_admin}
    password: ${DB_PASSWORD:chookjibup_admin}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

app:
  email:
    verification:
      sender: ${APP_EMAIL_VERIFICATION_SENDER:log}
  jwt:
    secret: ${APP_JWT_SECRET}
    access-token-expiration-seconds: 1800
  internal-auth:
    timestamp-tolerance: ${APP_INTERNAL_AUTH_TIMESTAMP_TOLERANCE:5m}
    nonce-ttl: ${APP_INTERNAL_AUTH_NONCE_TTL:10m}
    clients:
      chookjibup-user-server:
        secret: ${APP_INTERNAL_CHOOKJIBUP_USER_SECRET:}
        previous-secret: ${APP_INTERNAL_CHOOKJIBUP_USER_PREVIOUS_SECRET:}
  road-address:
    base-url: ${APP_ROAD_ADDRESS_BASE_URL:https://business.juso.go.kr}
    confirmation-key: ${APP_ROAD_ADDRESS_CONFIRMATION_KEY:}
    connect-timeout: ${APP_ROAD_ADDRESS_CONNECT_TIMEOUT:3s}
    read-timeout: ${APP_ROAD_ADDRESS_READ_TIMEOUT:5s}
  map:
    analysis:
      provider: ${APP_MAP_ANALYSIS_PROVIDER:disabled}
      base-url: ${APP_OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${APP_OPENAI_API_KEY:}
      model: ${APP_OPENAI_MAP_MODEL:gpt-5.6}
      connect-timeout: ${APP_OPENAI_CONNECT_TIMEOUT:5s}
      read-timeout: ${APP_OPENAI_READ_TIMEOUT:90s}
      max-attempts: ${APP_MAP_ANALYSIS_MAX_ATTEMPTS:3}
      poll-delay-millis: ${APP_MAP_ANALYSIS_POLL_DELAY_MILLIS:3000}
      max-input-bytes: ${APP_MAP_ANALYSIS_MAX_INPUT_BYTES:26214400}
    image:
      max-file-size: ${APP_MAP_IMAGE_MAX_FILE_SIZE:50MB}
      min-width: ${APP_MAP_IMAGE_MIN_WIDTH:800}
      min-height: ${APP_MAP_IMAGE_MIN_HEIGHT:600}
      max-original-side: ${APP_MAP_IMAGE_MAX_ORIGINAL_SIDE:16000}
      max-original-pixels: ${APP_MAP_IMAGE_MAX_ORIGINAL_PIXELS:80000000}
      analysis-max-side: ${APP_MAP_IMAGE_ANALYSIS_MAX_SIDE:4096}
      analysis-jpeg-quality: ${APP_MAP_IMAGE_ANALYSIS_JPEG_QUALITY:0.95}
    storage:
      provider: ${APP_MAP_STORAGE_PROVIDER:disabled}
      bucket: ${APP_MAP_STORAGE_BUCKET:}
      region: ${APP_MAP_STORAGE_REGION:ap-northeast-2}
      endpoint: ${APP_MAP_STORAGE_ENDPOINT:}
      path-style-access-enabled: ${APP_MAP_STORAGE_PATH_STYLE_ACCESS_ENABLED:false}
      connect-timeout: ${APP_MAP_STORAGE_CONNECT_TIMEOUT:3s}
      api-call-timeout: ${APP_MAP_STORAGE_API_CALL_TIMEOUT:30s}
      read-url-ttl: ${APP_MAP_STORAGE_READ_URL_TTL:10m}
