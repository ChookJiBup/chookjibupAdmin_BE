# GitHub production Environment의 ADMIN_APPLICATION_SECRET_YML 값으로
# 이 파일 전체를 붙여넣고 CHANGE_ME 항목을 실제 운영 값으로 교체한다.
# 실제 값이 입력된 application-secret.yml은 Git에 커밋하지 않는다.

spring:
  datasource:
    url: jdbc:postgresql://CHANGE_ME_DB_HOST:5432/CHANGE_ME_DB_NAME
    username: CHANGE_ME_DB_USERNAME
    password: "CHANGE_ME_DB_PASSWORD"
  data:
    redis:
      host: CHANGE_ME_REDIS_HOST
      port: 6379
  mail:
    host: smtp.gmail.com
    port: 587
    username: CHANGE_ME_GMAIL_ADDRESS@gmail.com
    # Google이 표시하는 네 글자 단위 공백을 포함해도 서버에서 제거한다.
    password: "xxxx xxxx xxxx xxxx"

app:
  auth:
    password-reset:
      # 관리자 프런트의 비밀번호 변경 화면 주소를 입력한다.
      frontend-url: https://CHANGE_ME_ADMIN_FRONTEND/password-reset
  email:
    verification:
      sender: smtp
      # Gmail 로그인 주소 또는 메일 제공자에서 검증한 발신 주소를 사용한다.
      from-address: CHANGE_ME_GMAIL_ADDRESS@gmail.com
      from-name: 축지법
      # 답장을 받을 주소가 따로 없다면 비워 둔다.
      reply-to:
  jwt:
    # 최소 32바이트 이상의 충분히 긴 난수를 사용한다.
    secret: CHANGE_ME_ADMIN_JWT_SECRET
  field-staff:
    jwt:
      # 관리자 JWT secret과 다른 난수를 사용한다.
      secret: CHANGE_ME_FIELD_STAFF_JWT_SECRET
  road-address:
    confirmation-key: CHANGE_ME_ROAD_ADDRESS_CONFIRMATION_KEY
  map:
    analysis:
      provider: openai
      base-url: https://api.openai.com
      api-key: CHANGE_ME_OPENAI_API_KEY
      model: gpt-5.6
    storage:
      provider: s3
      bucket: CHANGE_ME_S3_BUCKET
      region: ap-northeast-2
      endpoint:
      path-style-access-enabled: false
      read-url-ttl: 10m
      # AWS 자격 증명은 이 파일에 넣지 않는다.
      # EC2 IAM Role을 통해 S3 접근 권한을 제공한다.
