spring:
  mail:
    username: your-gmail-address@gmail.com
    # Google이 표시하는 네 글자 단위 공백을 포함해도 서버에서 제거한다.
    password: "xxxx xxxx xxxx xxxx"

app:
  auth:
    password-reset:
      # 관리자 프런트의 비밀번호 변경 화면 주소를 환경에 맞게 설정한다.
      frontend-url: http://localhost:3000/password-reset
  email:
    verification:
      sender: smtp
      # Gmail 로그인 주소 또는 Gmail/메일 제공자에서 검증한 발신 별칭을 사용한다.
      # 회사 도메인을 인증했다면 no-reply@your-domain.com 형태로 설정할 수 있다.
      from-address: your-gmail-address@gmail.com
      from-name: 축지법
      # 답장을 받을 주소가 따로 없다면 비워 둔다.
      reply-to:
  jwt:
    secret: change-me-local-jwt-secret-change-before-use
  field-staff:
    jwt:
      # 운영 환경에서는 관리자 JWT secret과 반드시 다른 값을 사용한다.
      secret: change-me-local-field-staff-jwt-secret-change-before-use
  internal-auth:
    clients:
      chookjibup-user-server:
        secret: change-me
        previous-secret:
  road-address:
    confirmation-key:
  map:
    analysis:
      # OpenAI 분석을 사용할 때 openai로 변경한다.
      provider: ${APP_MAP_ANALYSIS_PROVIDER:disabled}
      # 실제 키는 환경 변수로만 주입하고 저장소에 커밋하지 않는다.
      api-key: ${APP_OPENAI_API_KEY:}
      model: ${APP_OPENAI_MAP_MODEL:gpt-5.6}
    storage:
      # application.yml의 기본값을 로컬에서 덮어쓸 때만 사용한다.
      provider: ${APP_MAP_STORAGE_PROVIDER:disabled}
      bucket: ${APP_MAP_STORAGE_BUCKET:}
      region: ${APP_MAP_STORAGE_REGION:ap-northeast-2}
      endpoint: ${APP_MAP_STORAGE_ENDPOINT:}
      path-style-access-enabled: ${APP_MAP_STORAGE_PATH_STYLE_ACCESS_ENABLED:false}
      read-url-ttl: ${APP_MAP_STORAGE_READ_URL_TTL:10m}
      # AWS 자격 증명은 이 파일에 적지 않고 AWS_ACCESS_KEY_ID,
      # AWS_SECRET_ACCESS_KEY 또는 IAM Role/Profile 공급망을 사용한다.
