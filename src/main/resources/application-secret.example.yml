app:
  jwt:
    secret: change-me-local-jwt-secret-change-before-use
  internal-auth:
    clients:
      chookjibup-user-server:
        secret: change-me
        previous-secret:
  email:
    verification:
      sender: smtp
      from: your-gmail-address@gmail.com

spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: your-gmail-address@gmail.com
    password: your-google-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
