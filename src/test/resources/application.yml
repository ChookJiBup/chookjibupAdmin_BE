spring:
  datasource:
    url: jdbc:h2:mem:chookjibup_admin_test;MODE=PostgreSQL;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

app:
  auth:
    email-verification:
      request-limit: 5
      request-window: 10m
      resend-cooldown: 1m
    password-reset:
      request-limit: 5
      request-window: 10m
      resend-cooldown: 1m
      token-ttl: 30m
      frontend-url: http://localhost:3000/reset-password
  jwt:
    secret: test-jwt-secret-key-for-chookjibup-admin-local-tests
    access-token-expiration-seconds: 1800
  field-staff:
    jwt:
      secret: test-field-staff-jwt-secret-key-for-local-tests
      access-token-expiration-seconds: 1800
  road-address:
    base-url: https://business.juso.go.kr
    confirmation-key:
    connect-timeout: 3s
    read-timeout: 5s
