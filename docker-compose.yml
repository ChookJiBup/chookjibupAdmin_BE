services:
  postgres:
    image: postgres:16-alpine
    container_name: chookjibup-admin-postgres
    environment:
      POSTGRES_DB: chookjibup_admin
      POSTGRES_USER: chookjibup_admin
      POSTGRES_PASSWORD: chookjibup_admin
    ports:
      - "5432:5432"
    volumes:
      - chookjibup-admin-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: chookjibup-admin-redis
    ports:
      - "6379:6379"

volumes:
  chookjibup-admin-postgres-data:
